<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Dolma Forever : livre de recettes</title>
<link rel="stylesheet" href="book.css">
</head>
<body>
<div id="stage"><div id="book"></div></div>
<audio id="song" preload="auto" src="../audio/song.mp3"></audio>
<script src="../core/lyrics-data.js"></script>
<script src="../core/audio-analysis.js"></script>
<script src="../core/engine-state.js"></script>
<script src="book.js"></script>
<script>
  // ?t=55 : image fixe à l'instant 55 s (pour les captures). ?play : lecture avec le son, le temps vient de l'audio.
  // Dans les deux cas, le rendu passe par BOOK.renderAt(t), qui ne dépend que de t.
  (function () {
    const q = new URLSearchParams(location.search);
    if (q.has('t')) {
      window.BOOK.renderAt(parseFloat(q.get('t')));
      document.body.dataset.ready = '1';
    } else if (q.has('play')) {
      const audio = document.getElementById('song');
      if (q.has('from')) audio.currentTime = parseFloat(q.get('from'));
      const loop = () => { window.BOOK.renderAt(audio.currentTime); requestAnimationFrame(loop); };
      requestAnimationFrame(loop);
      document.body.dataset.ready = '1';
    } else {
      window.BOOK.renderAt(0);
      document.body.dataset.ready = '1';
    }
  })();
</script>
</body>
</html>
